name: Android Build

on:
  push:
    branches:
      - main
      - feature/euronics-webview-integration
      - feature/self-healing-command-dictionary
      - feature/autonomous-self-healing-edition
    paths:
      - "app/**"
      - "*.gradle"
      - "settings.gradle"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle"
      - "settings.gradle"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-smoke:
    name: Unit tests, APK build and Android smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Run unit and regression tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists and is non-empty
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Android emulator launch smoke test
        timeout-minutes: 22
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            timeout 120s adb wait-for-device
            [ "$(adb shell getprop sys.boot_completed | tr -d '\\r')" = "1" ]
            timeout 120s adb install -r -t app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.openjarvis android.permission.RECORD_AUDIO
            adb shell settings put secure enabled_accessibility_services com.openjarvis/com.openjarvis.accessibility.JarvisAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            adb shell appops set com.openjarvis SYSTEM_ALERT_WINDOW allow
            timeout 30s adb shell am start -W -n com.openjarvis/.ui.MainActivity
            sleep 5
            adb shell dumpsys accessibility | grep -F 'JarvisAccessibilityService'
            adb shell pidof com.openjarvis >/dev/null || { adb logcat -d -t 1500; exit 1; }
            adb shell dumpsys activity activities | grep -F 'com.openjarvis/.ui.MainActivity'
            ! adb logcat -d -t 1500 | grep -F 'FATAL EXCEPTION'

      - name: Upload tested debug APK
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-autonomous-self-healing-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
