name: Android Build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle"
      - "settings.gradle"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Android emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.openjarvis android.permission.RECORD_AUDIO
            adb shell settings put secure enabled_accessibility_services com.openjarvis/com.openjarvis.accessibility.JarvisAccessibilityService
            adb shell settings put secure accessibility_enabled 1
            adb shell am start -W -n com.openjarvis/.ui.MainActivity
            sleep 6
            adb shell dumpsys accessibility | grep -F 'JarvisAccessibilityService'
            if ! adb shell pidof com.openjarvis; then
              adb logcat -d -t 1500
              exit 1
            fi
            adb shell dumpsys activity activities | grep -F 'com.openjarvis/.ui.MainActivity'
