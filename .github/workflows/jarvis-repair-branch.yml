name: Jarvis Autonomous Repair Branch

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Branch or commit to repair
        required: true
        default: main
        type: string
      patch_b64:
        description: Base64-encoded unified diff generated by Open Jarvis
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jarvis-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate patch, run tests and build candidate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout exact base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record immutable base SHA
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Decode, validate and apply patch
        env:
          PATCH_B64: ${{ inputs.patch_b64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, re, subprocess
          patch = base64.b64decode(os.environ["PATCH_B64"], validate=True).decode("utf-8")
          if not patch or len(patch.encode()) > 24000:
              raise SystemExit("Patch is empty or exceeds 24 KB")
          if any(x in patch.lower() for x in ("euronics", "local.properties", "begin private key", ".github/workflows", "app/build.gradle")):
              raise SystemExit("Patch references a protected path or secret")
          allowed = ("app/src/main/java/com/openjarvis/", "app/src/test/java/com/openjarvis/")
          headers = [line[4:].split(chr(9), 1)[0] for line in patch.splitlines() if line.startswith(("--- ", "+++ "))]
          paths = []
          for raw in headers:
              if raw == "/dev/null":
                  continue
              p = raw[2:] if raw.startswith(("a/", "b/")) else raw
              if p.startswith("/") or chr(92) in p or ".." in p.split("/") or not p.startswith(allowed):
                  raise SystemExit("Patch path is outside Jarvis source/test allow-list: " + p)
              paths.append(p)
          if not paths:
              raise SystemExit("No unified-diff file paths found")
          pathlib.Path("/tmp/jarvis-repair.patch").write_text(patch)
          subprocess.run(["git", "apply", "--check", "/tmp/jarvis-repair.patch"], check=True)
          subprocess.run(["git", "apply", "/tmp/jarvis-repair.patch"], check=True)
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          untracked = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines()
          actual = changed + untracked
          if not actual or any(not p.startswith(allowed) or ".." in p.split("/") for p in actual):
              raise SystemExit("Applied patch changed a path outside the allow-list")
          pathlib.Path("/tmp/jarvis-repair.patch").replace("jarvis-repair.patch")
          PY

      - name: Run unit and regression tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build candidate debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify candidate APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload validated patch and APK
        uses: actions/upload-artifact@v4
        with:
          name: validated-repair-candidate
          path: |
            jarvis-repair.patch
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  commit-and-pr:
    name: Create repair branch, commit and pull request
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the exact tested base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.base_sha }}
          fetch-depth: 0

      - name: Download validated patch
        uses: actions/download-artifact@v4
        with:
          name: validated-repair-candidate
          path: candidate

      - name: Commit and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
        run: |
          set -euo pipefail
          git apply --check candidate/jarvis-repair.patch
          git apply candidate/jarvis-repair.patch
          git config user.name "Open Jarvis Repair Bot"
          git config user.email "open-jarvis-repair[bot]@users.noreply.github.com"
          BRANCH="autonomous-repair/${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git add app/src/main/java/com/openjarvis app/src/test/java/com/openjarvis
          if git diff --cached --quiet; then
            echo "No source changes to commit"; exit 1
          fi
          git commit -m "Autonomous repair: validated Kotlin patch"
          git push origin "$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "Open Jarvis autonomous repair #${GITHUB_RUN_ID}" \
            --body "AI-generated Kotlin patch. It was applied to base $BASE_SHA and passed :app:testDebugUnitTest and :app:assembleDebug before commit. Review the diff and require PR CI before merging."

      - name: Roll back unmerged repair branch if PR creation fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="autonomous-repair/${GITHUB_RUN_ID}"
          git push origin --delete "$BRANCH" 2>/dev/null || true
