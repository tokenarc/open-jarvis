name: Jarvis Autonomous Repair Branch

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Existing branch to repair
        required: true
        default: feature/autonomous-self-healing-edition
        type: string
      patch_b64:
        description: Base64-encoded unified diff generated by Open Jarvis
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: jarvis-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout requested base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Validate and apply AI patch
        env:
          PATCH_B64: ${{ inputs.patch_b64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          raw = base64.b64decode(os.environ["PATCH_B64"], validate=True)
          patch = raw.decode("utf-8")
          if len(patch) > 24000:
              raise SystemExit("Patch exceeds 24 KB limit")
          if "app/src/main/assets/euronics" in patch.lower() or "local.properties" in patch:
              raise SystemExit("Protected path referenced")
          pathlib.Path("/tmp/jarvis-repair.patch").write_text(patch)
          PY
          git apply --check /tmp/jarvis-repair.patch
          git apply /tmp/jarvis-repair.patch
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(["git","diff","--name-only"], text=True).splitlines()
          allowed = ("app/src/main/java/com/openjarvis/", "app/src/test/java/com/openjarvis/")
          if not paths or any(not p.startswith(allowed) or ".." in p.split("/") for p in paths):
              raise SystemExit("Patch changed a path outside the Jarvis source/test allow-list")
          PY

      - name: Run unit and regression tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build candidate debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit only after tests and build pass
        run: |
          git config user.name "Open Jarvis Repair Bot"
          git config user.email "open-jarvis-repair[bot]@users.noreply.github.com"
          BRANCH="autonomous-repair/${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git add app/src/main/java/com/openjarvis app/src/test/java/com/openjarvis
          git commit -m "Autonomous repair: validated Kotlin patch"
          git push origin "$BRANCH"
